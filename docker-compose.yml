services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: durable
      POSTGRES_PASSWORD: durable
      POSTGRES_DB: durable
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durable -d durable"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

  api:
    build: .
    command: ["api"]
    environment:
      DATABASE_URL: postgres://durable:durable@postgres:5432/durable?sslmode=disable
      WORKRAIL_API_ADDR: :8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["worker"]
    environment:
      DATABASE_URL: postgres://durable:durable@postgres:5432/durable?sslmode=disable
      WORKRAIL_WORKER_ID: compose-worker-1
      WORKRAIL_QUEUE: default
      WORKRAIL_WORKER_CONCURRENCY: 4
      WORKRAIL_SHUTDOWN_TIMEOUT: 30s
    depends_on:
      postgres:
        condition: service_healthy
