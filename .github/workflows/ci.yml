name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: durable
          POSTGRES_PASSWORD: durable
          POSTGRES_DB: durable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U durable -d durable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://durable:durable@localhost:5432/durable?sslmode=disable
      TEST_DATABASE_URL: postgres://durable:durable@localhost:5432/durable?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - name: Apply migrations
        run: go run ./cmd/workrail migrate up
      - name: Test (unit + integration)
        run: go test -race ./...
